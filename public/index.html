<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>节点管理面板</title>
<script>
  /* 首屏定主题：必须在样式表之前跑，否则会先闪一下默认配色 */
  (function () {
    try {
      document.documentElement.dataset.theme = localStorage.getItem('np_theme') === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234c8dff'/><circle cx='50' cy='50' r='16' fill='%23071018'/></svg>">
</head>
<body>

<!-- 登录 -->
<div id="login" class="login-wrap hidden">
  <button class="theme-btn login-theme" data-theme-toggle type="button" title="切换到日间模式" aria-label="切换到日间模式">
    <span class="ico">☀</span>
  </button>
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div class="brand-text">
        <b id="login-site">节点管理面板</b>
        <span>Control Plane</span>
      </div>
    </div>
    <form id="login-form">
      <div class="field">
        <label>管理员账号</label>
        <input type="text" id="login-user" value="admin" autocomplete="username" placeholder="admin">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block" type="submit" style="margin-top:6px;padding:11px">登 录</button>
    </form>
    <p class="hint" style="text-align:center;margin-top:16px">
      默认 admin / admin888 · 登录后请及时修改
    </p>
  </div>
</div>

<!-- 强制改密：出厂密码还没改时，登录后必须先过这一关 -->
<div id="force-pw" class="login-wrap hidden">
  <button class="theme-btn login-theme" data-theme-toggle type="button" title="切换到日间模式" aria-label="切换到日间模式">
    <span class="ico">☀</span>
  </button>
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div class="brand-text">
        <b>先设置一个新密码</b>
        <span>Security</span>
      </div>
    </div>
    <p class="hint" style="margin:0 0 14px">
      当前账号还在使用出厂默认密码。这个面板可能暴露在公网，请先改掉再继续。
    </p>
    <form id="force-pw-form">
      <div class="field">
        <label>新密码</label>
        <input type="password" id="fp-new" autocomplete="new-password" placeholder="至少 8 位，别用 admin888">
      </div>
      <div class="field">
        <label>确认新密码</label>
        <input type="password" id="fp-confirm" autocomplete="new-password" placeholder="再输一次">
      </div>
      <button class="btn btn-primary btn-block" type="submit" style="margin-top:6px;padding:11px">设置新密码</button>
    </form>
    <p class="hint" style="text-align:center;margin-top:16px">改完会用新密码重新登录一次</p>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="layout hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div class="brand-text">
        <b id="side-site">节点面板</b>
        <span>Control Plane</span>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-item" data-view="dashboard" title="概览"><span class="ico">◈</span><span class="label">概览</span></div>
      <div class="nav-item" data-view="users" title="用户"><span class="ico">☺</span><span class="label">用户</span></div>
      <div class="nav-item" data-view="plans" title="套餐"><span class="ico">◇</span><span class="label">套餐</span></div>
      <div class="nav-item" data-view="nodes" title="节点"><span class="ico">◆</span><span class="label">节点</span></div>
      <div class="nav-item" data-view="stats" title="流量"><span class="ico">▦</span><span class="label">流量</span></div>
      <div class="nav-item" data-view="servers" title="服务器"><span class="ico">▤</span><span class="label">服务器</span></div>
      <div class="nav-item" data-view="audit" title="日志"><span class="ico">≡</span><span class="label">日志</span></div>
      <div class="nav-item" data-view="settings" title="设置"><span class="ico">⚙</span><span class="label">设置</span></div>
    </nav>

    <div class="sidebar-foot">
      <div id="side-user">—</div>
      <div class="side-links">
        <a href="#" id="logout">退出登录</a>
        <span class="side-ver" id="side-ver"></span>
      </div>
    </div>

    <button class="collapse-btn" id="collapse" title="收起菜单">
      <span class="ico">«</span><span class="label">收起菜单</span>
    </button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">概览</h1>
        <div class="sub" id="page-sub">—</div>
      </div>
      <div class="topbar-actions">
        <div id="page-actions" style="display:flex;gap:8px"></div>
        <button class="theme-btn" data-theme-toggle type="button" title="切换到日间模式" aria-label="切换到日间模式">
          <span class="ico">☀</span>
        </button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div id="toast-root"></div>
<script src="/theme.js"></script>
<!-- 经典脚本按顺序加载：顶层声明共享全局词法环境，所以不需要打包器 -->
<script src="/js/core.js"></script>
<script src="/js/overview.js"></script>
<script src="/js/users.js"></script>
<script src="/js/plans.js"></script>
<script src="/js/nodes.js"></script>
<script src="/js/stats.js"></script>
<script src="/js/servers.js"></script>
<script src="/js/audit.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
