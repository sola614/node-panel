<script>
  /* 首屏定主题：必须在样式表之前跑，否则会先闪一下默认配色 */
  (function () {
    try {
      document.documentElement.dataset.theme = localStorage.getItem('np_theme') === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>
