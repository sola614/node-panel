name: build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 先跑端到端冒烟测试，测试不过不构建镜像
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 单元 / 端到端（自带临时库，不需要先起服务）
      - name: 续期与安全测试
        run: |
          # 先查版本号：package.json 升了、agent.sh 的 VERSION= 忘了跟，会让下面
          # agent 测试一进门就退出。这条只要一秒钟，放在最前面挡住
          node test/version.js
          # 再查镜像：Dockerfile 拷进去的东西够不够让面板跑起来（0.1.32 漏了 server/ 目录）
          node test/dockerfile.js
          node test/renew.js
          node test/security.js
          # 生成物回读：部署/卸载/中转脚本过 bash -n，YAML 订阅交给真解析器读回来。
          # 这两类产物出错时面板不报错，只在用户机器上表现为「脚本跑一半」「少一个节点」
          node test/generators.js
          # 事务语义：水位与用量必须同进同退，回滚时内存要由调用方还原
          node test/tx.js
          # 版本检查：假 GitHub API，验版本比较 / 缓存 / 404 / 500 降级
          node test/update.js
          # ACME 临时目录：私钥不能留在磁盘上、目录必须 0700（Windows 上跑不了，
          # 这条只在 Linux 上才有区分度，所以必须在 CI 里跑）
          node test/acme.js

      # 通知通道（假 SMTP + 假 HTTP）与 agent 自更新（假面板 + 真 agent.sh）
      - name: 通知与 agent 测试
        run: |
          node test/notify.js
          node test/agent.js

      # 前端行为测试需要 jsdom；不想为它维护 lockfile，直接装到临时依赖里
      - name: 安装 jsdom（仅测试用）
        run: npm install jsdom --no-save --no-package-lock

      - name: 启动面板并跑冒烟 + 前端测试
        env:
          PANEL_ADMIN_PASSWORD: ci-test-pass-123
        run: |
          node server.js &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then break; fi
            sleep 1
          done
          node test/smoke.js http://127.0.0.1:8080
          node test/ui.js http://127.0.0.1:8080
          # 真浏览器回归：点不到的元素、原生文件选择、真实导航只有它能测出来。
          # 找不到 Chrome 时脚本会自己跳过（ubuntu-latest 自带，正常不会被跳过）
          node test/browser.js http://127.0.0.1:8080

      - name: 浏览器测试截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shots
          path: /tmp/node-panel-shots
          if-no-files-found: ignore

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU（跨架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本号统一以 package.json 为准：镜像 tag、Dockerfile 的 label、面板侧栏显示的都是它
      - name: 读取版本号
        id: pkg
        run: |
          VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json)
          if [ -z "$VERSION" ]; then
            echo "✗ 没能从 package.json 读到 version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "▸ 应用版本：$VERSION（次版本线 ${VERSION%.*}）"

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.pkg.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.pkg.outputs.minor }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable={{is_default_branch}}

      # 先把镜像在本地构建出来跑一次，确认它真的能起来：
      # 0.1.32 的教训是 server.js 拆目录后 Dockerfile 少 COPY 了一个目录，
      # 静态检查能挡住 require，但「镜像里到底缺什么」只有真跑一遍才知道。
      # 这一步在推送之前，坏镜像不会拿到 tag。
      - name: 构建本地镜像用于自检（单架构，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: node-panel:ci-check
          build-args: |
            APP_VERSION=${{ steps.pkg.outputs.version }}
          cache-from: type=gha

      - name: 容器启动自检
        run: |
          docker run -d --name np-check -p 18080:8080 node-panel:ci-check
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1; then
              echo "▸ 容器已就绪：$(curl -fsS http://127.0.0.1:18080/api/health)"
              docker rm -f np-check >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "✗ 容器 40 秒内没起来，日志如下：" >&2
          docker logs np-check >&2 || true
          docker rm -f np-check >/dev/null || true
          exit 1

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.pkg.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 镜像推完之后建 Release 与 v 标签：面板上的「检查更新」读的就是 releases/latest。
  # 没有这一步，那个接口永远拿 404 —— 仓库原先既没有 tag 也没有 Release，
  # 「最新版本」根本缺少一个可信来源。
  #
  # 用 GITHUB_TOKEN 建 Release 不会触发下面的 tag push 工作流（GitHub 对
  # token 触发的事件有防递归限制），所以不会二次构建。换成 PAT 就会 —— 那时候
  # 要么去掉 on.push.tags，要么给这个 job 加一道「tag 已存在就跳过」的判断。
  release:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: pkg
        run: |
          VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json)
          if [ -z "$VERSION" ]; then
            echo "✗ 没能从 package.json 读到 version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "▸ 应用版本：$VERSION"

      # 只推 chore / 文档时版本号没变，Release 已经存在 —— 跳过而不是报错
      - name: 同名 Release 已存在就跳过
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "▸ v${{ steps.pkg.outputs.version }} 已经有 Release，跳过"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      # 说明直接取 CHANGELOG 里这一版的段落：发版规矩本来就要求一版一段，
      # 让 Release 和仓库里的更新日志是同一份文字，不另写一遍。
      - name: 从 CHANGELOG 抽取本版说明
        if: steps.exists.outputs.skip == '0'
        run: |
          node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex((l) => l.startsWith("## [" + ver + "]"));
            if (start < 0) {
              console.log("本次发布没有在 CHANGELOG.md 里找到 v" + ver + " 段落，请补上。");
              process.exit(0);
            }
            const out = [];
            for (let i = start + 1; i < lines.length; i++) {
              if (/^## \[/.test(lines[i])) break;
              out.push(lines[i]);
            }
            process.stdout.write(out.join("\n").trim() + "\n");
          ' "${{ steps.pkg.outputs.version }}" > /tmp/notes.md
          echo "── Release 说明 ──"
          head -20 /tmp/notes.md

      - name: 创建 Release 与 v 标签
        if: steps.exists.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.pkg.outputs.version }}" \
            --title "v${{ steps.pkg.outputs.version }}" \
            --notes-file /tmp/notes.md \
            --target "$GITHUB_SHA"
          echo "▸ 已创建 https://github.com/${{ github.repository }}/releases/tag/v${{ steps.pkg.outputs.version }}"

