name: build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 先跑端到端冒烟测试，测试不过不构建镜像
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 单元 / 端到端（自带临时库，不需要先起服务）
      - name: 续期与安全测试
        run: |
          node test/renew.js
          node test/security.js

      # 通知通道（假 SMTP + 假 HTTP）与 agent 自更新（假面板 + 真 agent.sh）
      - name: 通知与 agent 测试
        run: |
          node test/notify.js
          node test/agent.js

      # 前端行为测试需要 jsdom；不想为它维护 lockfile，直接装到临时依赖里
      - name: 安装 jsdom（仅测试用）
        run: npm install jsdom --no-save --no-package-lock

      - name: 启动面板并跑冒烟 + 前端测试
        env:
          PANEL_ADMIN_PASSWORD: ci-test-pass-123
        run: |
          node server.js &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then break; fi
            sleep 1
          done
          node test/smoke.js http://127.0.0.1:8080
          node test/ui.js http://127.0.0.1:8080

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置 QEMU（跨架构构建）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 版本号统一以 package.json 为准：镜像 tag、Dockerfile 的 label、面板侧栏显示的都是它
      - name: 读取版本号
        id: pkg
        run: |
          VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json)
          if [ -z "$VERSION" ]; then
            echo "✗ 没能从 package.json 读到 version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "▸ 应用版本：$VERSION（次版本线 ${VERSION%.*}）"

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.pkg.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.pkg.outputs.minor }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.pkg.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
