services:
  panel:
    # 用官方构建的镜像，或注释掉 image 用下面的 build 本地构建
    image: ghcr.io/sola614/node-panel:latest
    build: .
    container_name: node-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 首次启动时用于生成管理员账号，之后改这里不会覆盖已有密码
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:-admin888}
      # 设为 0 则不写入演示数据
      PANEL_SEED: ${PANEL_SEED:-1}
      TZ: Asia/Shanghai
    volumes:
      - panel-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  panel-data:
