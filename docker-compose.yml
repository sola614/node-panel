services:
  panel:
    # beta 版本线：默认跟 0.1.x，可用 PANEL_IMAGE_TAG=0.1.1 精确锁定
    image: ghcr.io/sola614/node-panel:${PANEL_IMAGE_TAG:-0.1}
    build: .
    container_name: node-panel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 首次建库时用于生成管理员账号，之后改这里不会覆盖已有密码
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:-admin888}
      # 默认空库启动（只有 admin）。想看演示数据再设 PANEL_SEED_DEMO=1
      PANEL_SEED_DEMO: ${PANEL_SEED_DEMO:-}
      TZ: Asia/Shanghai
    volumes:
      - panel-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  panel-data:
